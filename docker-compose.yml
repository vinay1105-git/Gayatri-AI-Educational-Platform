services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gayatri-ai-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-32chars-minimum}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/gayatri_ai.db}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - gayatri_data:/app/data
      - gayatri_ml:/app/ml_artifacts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: gayatri-ai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  gayatri_data:
  gayatri_ml:
